name: "Crowdin Translations"
run-name: "[🌐]: Crowdin Translations #${{ github.run_number }}"

on:
#  push:
#    branches: [main]
#    paths:
#      - 'content/docs/**/en_us/**/*.md'
#      - 'content/changelog/**/en_us/**/*.md'
  workflow_dispatch:
    inputs:
      create_pr:
        description: "Create Pull Request after sync"
        type: boolean
        default: false
        required: true
#  schedule:
#    # Run daily at 3 AM UTC
#    - cron: '0 3 * * *'


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  LOCALIZATION_BRANCH: translations
  TARGET_BRANCH: main

jobs:
  sync-docs:
    name: "[🔄] Sync Docs"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Crowdin"
        uses: TerraFirmaGreg-Team/Actions/crowdin/sync@main
        with:
          config: .github/config/crowdin.yml
          upload_sources_args: "--delete-obsolete"
          download_translations: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          skip_untranslated_files: true
          localization_branch: ${{ env.LOCALIZATION_BRANCH }}
          target_branch: ${{ env.TARGET_BRANCH }}
          commit_message: "[translation] New translations"
          crowdin_token: ${{ secrets.CROWDIN_TOKEN }}
          crowdin_id: ${{ vars.CROWDIN_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  create-pr:
    name: "[🤝] Create Pull Request"
    runs-on: ubuntu-latest
    needs: [sync-docs]
    if: (github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch' && inputs.create_pr)
    steps:
      - name: "Create Pull Request"
        id: create_pr
        uses: TerraFirmaGreg-Team/Actions/pull-request/create@main
        with:
          source_branch: ${{ env.LOCALIZATION_BRANCH }}
          target_branch: ${{ env.TARGET_BRANCH }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          label: "Pull request: Translation"
          title: 'add: New Crowdin translations'
          body: |
            ## 🌐 New translations from Crowdin

            ### 🔄 Changes
            - Updated translation files

      - name: "Automatically Merge PR"
        uses: TerraFirmaGreg-Team/Actions/pull-request/automerge@main
        with:
          app_client_id: ${{ vars.APP_ID }}
          app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          pull_request: ${{ steps.create_pr.outputs.pr_number }}
