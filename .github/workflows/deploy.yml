name: deploy

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Normalize APP_PRIVATE_KEY
        uses: actions/github-script@v7
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        with:
          script: |
            const flat = process.env.APP_PRIVATE_KEY.replace(/[\n"]/g, '')
            core.setSecret(flat)
            core.exportVariable('APP_PRIVATE_KEY_FLAT', flat)

      - uses: amondnet/vercel-action@v42.3.0
        id: vercel
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID }}
          vercel-build: true
          target: ${{ github.ref == 'refs/heads/dev' && 'production' || 'preview' }}
          github-comment: ${{ github.event_name == 'pull_request' }}
          build-env: |
            NEXT_PUBLIC_DUMP_STORAGE_URL=${{ vars.NEXT_PUBLIC_DUMP_STORAGE_URL }}
          env: |
            NEXT_PUBLIC_DUMP_STORAGE_URL=${{ vars.NEXT_PUBLIC_DUMP_STORAGE_URL }}
            CLOUDFLARE_ACCOUNT_ID=${{ vars.CLOUDFLARE_ACCOUNT_ID }}
            CLOUDFLARE_D1_DATABASE_ID=${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
            COMMENTS_AUTH=${{ vars.COMMENTS_AUTH }}
            APP_ID=${{ vars.APP_ID }}
            APP_CLIENT_ID=${{ vars.APP_CLIENT_ID }}
            CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}
            APP_PRIVATE_KEY=${{ env.APP_PRIVATE_KEY_FLAT }}
            APP_SECRET=${{ secrets.APP_SECRET }}
            DISCUSSIONS_SECRET=${{ secrets.DISCUSSIONS_SECRET }}
