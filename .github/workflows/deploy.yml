name: deploy

on:
  push:
    branches:
      - dev
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: npm install -g vercel@65.8.0

      - name: Select Vercel target
        run: |
          if [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            echo "VERCEL_ENV=production" >> "$GITHUB_ENV"
            echo "VERCEL_FLAGS=--prod" >> "$GITHUB_ENV"
          else
            echo "VERCEL_ENV=preview" >> "$GITHUB_ENV"
            echo "VERCEL_FLAGS=" >> "$GITHUB_ENV"
          fi

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment="$VERCEL_ENV" --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build $VERCEL_FLAGS --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_DUMP_STORAGE_URL: ${{ vars.NEXT_PUBLIC_DUMP_STORAGE_URL }}

      - uses: amondnet/vercel-action@v42.3.0
        id: vercel
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          vercel-org-id: ${{ vars.VERCEL_ORG_ID }}
          vercel-project-id: ${{ vars.VERCEL_PROJECT_ID }}
          github-comment: ${{ github.event_name == 'pull_request' }}
          vercel-args: |
            --prebuilt ${{ env.VERCEL_FLAGS }}
            --env "NEXT_PUBLIC_DUMP_STORAGE_URL=${{ vars.NEXT_PUBLIC_DUMP_STORAGE_URL }}"
            --env "CLOUDFLARE_ACCOUNT_ID=${{ vars.CLOUDFLARE_ACCOUNT_ID }}"
            --env "CLOUDFLARE_D1_DATABASE_ID=${{ vars.CLOUDFLARE_D1_DATABASE_ID }}"
            --env "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}"
            --env "COMMENTS_AUTH=${{ vars.COMMENTS_AUTH }}"
            --env "APP_ID=${{ vars.APP_ID }}"
            --env "APP_CLIENT_ID=${{ vars.APP_CLIENT_ID }}"
            --env "APP_PRIVATE_KEY=${{ secrets.APP_PRIVATE_KEY }}"
            --env "APP_SECRET=${{ secrets.APP_SECRET }}"
            --env "DISCUSSIONS_SECRET=${{ secrets.DISCUSSIONS_SECRET }}"
